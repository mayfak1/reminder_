databaseChangeLog:
  - changeSet:
      id: 004-add-reminder-notification-state
      author: mayfak
      changes:
        - addColumn:
            tableName: reminders
            columns:
              - column:
                  name: status
                  type: varchar(16)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_attempt_at
                  type: timestamp with time zone
              - column:
                  name: next_attempt_at
                  type: timestamp with time zone
        - update:
            tableName: reminders
            columns:
              - column:
                  name: status
                  value: SENT
            where: notified_at is not null
        - createIndex:
            tableName: reminders
            indexName: idx_reminders_notify_queue
            columns:
              - column:
                  name: status
              - column:
                  name: remind
              - column:
                  name: next_attempt_at
              - column:
                  name: attempt_count
